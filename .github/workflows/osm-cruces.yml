name: osm-cruces

# Arma cada mes el índice de cruces de calles de la Región de Valparaíso desde
# el extracto de Chile de Geofabrik y lo publica como release `osm-cruces-*`.
# Los workers de Render lo bajan solos (app/services/osm_cruces_service.py):
# este workflow no necesita ni toca la base.

on:
  schedule:
    # El día 3 a las 07:17 UTC: Geofabrik ya publicó el extracto del mes.
    - cron: "17 7 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-cruces
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/scripts/requirements-osm.txt
      - run: pip install -r scripts/requirements-osm.txt
      - name: Extracto de Chile (Geofabrik)
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -o "$RUNNER_TEMP/chile.osm.pbf" \
            https://download.geofabrik.de/south-america/chile-latest.osm.pbf
          ls -lh "$RUNNER_TEMP/chile.osm.pbf"
      - name: Índice de cruces
        run: python -m scripts.osm_cruces --pbf "$RUNNER_TEMP/chile.osm.pbf" --salida dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          etiqueta="osm-cruces-$(date -u +%Y-%m-%d-%H%M)"
          filas=$(python -c "import json;print(json.load(open('dist/osm_cruces.json'))['filas'])")
          datos=$(python -c "import json;print(json.load(open('dist/osm_cruces.json'))['datos_de'] or '')")
          {
            echo "Índice de cruces de calles de la Región de Valparaíso para AlertaV."
            echo
            echo "datos_de: ${datos}"
            echo "filas: ${filas}"
            echo
            echo "Datos © OpenStreetMap contributors, bajo licencia ODbL 1.0"
            echo "(https://www.openstreetmap.org/copyright). Extracto de Geofabrik."
          } > "$RUNNER_TEMP/notas.md"
          gh release create "$etiqueta" dist/osm_cruces.csv.gz dist/osm_cruces.json \
            --title "Índice de cruces OSM ${etiqueta#osm-cruces-}" \
            --notes-file "$RUNNER_TEMP/notas.md" --latest=false
      - name: Dejar sólo los tres releases más nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep '^osm-cruces-' | sort -r | tail -n +4 \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
