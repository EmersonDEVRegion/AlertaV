name: keepalive

# Render (plan gratuito) apaga el servicio tras 15 minutos sin trafico HTTP, y
# con el se apagan los workers: nadie recolecta ni correlaciona. Medido en
# collector_runs: del 16 al 18 y del 20 al 22 de septiembre de 2026 no corrio
# ningun collector. Ver backend/DEPLOY.md, paso 5.
#
# Tiene que ser un ping EXTERNO: lo que cuenta para Render es el trafico que
# entra por su edge. GitHub Actions lo es, y en un repositorio publico no
# consume minutos.
#
# No es puntual, y en la practica casi no corre: pide cada 10 minutos, pero del
# 5 al 6 de octubre de 2026 GitHub lo lanzo cada 6-7 horas (runs #65 a #69). Con
# eso Render se dormiria igual. Ademas apaga los cron de un repositorio que pasa
# 60 dias sin actividad. Lo que de verdad mantiene despierta la API tiene que
# ser un monitor externo (cron-job.org o UptimeRobot, gratis): ver
# backend/DEPLOY.md, paso 5. Este workflow queda como respaldo.
#
# El 05-10 (run #67) el job quedo 15 minutos sin maquina y GitHub lo cancelo:
# "The job was not acquired by Runner of type hosted even after multiple
# attempts". Es un fallo de GitHub, no de la API, y no se puede evitar desde
# aca: llega como correo de "Run cancelled". Para dejar de recibirlos, en
# GitHub: Settings > Notifications > Actions > "Only notify for failed
# workflows" (o desmarcar el correo).
#
# El paso nunca falla: un servicio caido no debe convertirse en 144 correos de
# GitHub al dia. Deja una advertencia en el resumen de la corrida.
#
# Otra URL sin tocar este archivo: variable de repositorio ALERTAV_HEALTH_URL
# (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Fijo y no `ubuntu-latest`, que pasa a Ubuntu 26 desde el 19-10-2026 y
    # deja un aviso en cada corrida. Para un curl da lo mismo.
    runs-on: ubuntu-24.04
    # Tiene que caberle el peor caso del curl: 3 intentos x 120 s + 2 x 10 s =
    # 380 s. Con 5 minutos, un arranque en frio lento terminaba en "cancelled".
    timeout-minutes: 10
    steps:
      - name: Despertar la API
        env:
          URL: ${{ vars.ALERTAV_HEALTH_URL || 'https://alertav-api.onrender.com/api/v1/health' }}
        run: |
          # El arranque en frio de Render tarda alrededor de un minuto.
          if codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --max-time 120 --retry 2 --retry-delay 10 "$URL"); then
            echo "HTTP $codigo desde $URL"
            if [ "$codigo" != "200" ]; then
              echo "::warning::la API respondio HTTP $codigo"
            fi
          else
            echo "::warning::la API no respondio en 3 intentos de 120 s ($URL)"
          fi
