<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AlertaV — alerta general">
  <!--
    Marca de ALERTA GENERAL, no de incendio.

    La llama anterior era del hito en que el sistema sólo veía fuego. Hoy el mapa
    lleva cortes eléctricos, sismos, accidentes viales, cortes de ruta y lluvia,
    y un icono de llama afirma en la barra de pestañas —y en la pantalla de
    inicio del teléfono— algo que la aplicación no es.

    Dos piezas, y ninguna nombra un fenómeno:

      * el anillo de radar, que dice «esto vigila una zona»;
      * el triángulo de advertencia, la forma universal del aviso (ISO 7010),
        centrado en el barrido: donde el radar pone lo que encontró.

    Las proporciones están puestas para 16 px, que es el tamaño real de la
    pestaña, no para esta vista: el triángulo ocupa poco más de la mitad del
    lienzo para que el anillo siga siendo un anillo y no dos astillas a los
    lados. Trazo grueso, sin degradados y sin detalle interior — a ese tamaño
    sólo sobreviven la silueta y el hueco del signo.

    Los colores son los tokens del cromo (`#0f172a` de fondo, ámbar de aviso,
    celeste de la capa de lluvia) para que el icono no traiga una paleta propia.
  -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Anillo de radar. Discontinuo y girado para leerse como barrido y no como
       borde: un círculo continuo compite con el redondeo del propio lienzo. -->
  <circle
    cx="32" cy="32" r="23"
    fill="none"
    stroke="#38bdf8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="30 13"
    stroke-dashoffset="8"
    opacity="0.5"
  />

  <!-- Triángulo de advertencia. Vértices redondeados: a 16 px una esquina
       aguda se convierte en un pixel suelto que ensucia la silueta. -->
  <path
    d="M32 17.5 47.6 43a2.9 2.9 0 0 1-2.5 4.4H18.9A2.9 2.9 0 0 1 16.4 43Z"
    fill="#f59e0b"
    stroke="#0f172a"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Signo de exclamación recortado en el color del fondo: un hueco se lee
       mejor que un trazo claro cuando el icono mide 16 px. -->
  <g fill="#0f172a">
    <rect x="29.7" y="27.5" width="4.6" height="10.5" rx="2.3"/>
    <circle cx="32" cy="42.4" r="2.5"/>
  </g>
</svg>
