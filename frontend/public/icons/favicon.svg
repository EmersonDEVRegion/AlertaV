<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AlertaV">
  <!--
    Marca de AlertaV: el triángulo de aviso con una V calada (§H, 30-09-2026).

    Fuente ÚNICA de todos los íconos: `npm run icons` (scripts/icons.mjs) genera
    desde este archivo los PNG de la PWA, el de iOS, el maskable y el badge de
    las notificaciones. No se editan los PNG a mano.

      * El triángulo es la forma universal del aviso (ISO 7010) y no nombra un
        fenómeno: sirve igual para un incendio, un corte o un sismo.
      * La V, en el lugar del «!», es Valparaíso: la V Región. Calada en el color
        del fondo porque a 16 px un hueco se lee mejor que un trazo claro.

    Centrado óptico: la caja del triángulo (con su trazo de redondeo) va de
    y=11,5 a y=50,5, es decir, centrada en 31 y no en 32. Un triángulo carga el
    peso abajo; subirlo un punto lo deja visualmente al medio. El `<g id="marca">`
    es lo que el script escala para la zona segura del ícono maskable.
  -->
  <rect id="fondo" width="64" height="64" rx="14" fill="#0f172a"/>
  <g id="marca">
    <!-- Triángulo ámbar. El trazo del mismo color redondea las esquinas: a 16 px
         una punta aguda se vuelve un pixel suelto. -->
    <path d="M32 15 50.5 47H13.5Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round"/>
    <!-- La V: vértice en punta (miter) para que se lea como letra y no como
         una «u»; puntas de los brazos redondeadas. -->
    <path d="M26 28.2 32 41 38 28.2" fill="none" stroke="#0f172a" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </g>
</svg>
