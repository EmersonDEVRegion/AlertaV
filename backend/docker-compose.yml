# PostGIS para desarrollo local, con la misma versión mayor que producción
# (Supabase: PostgreSQL 17). El esquema lo crea `alembic upgrade head`.
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: alertav-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alertav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertav}
      POSTGRES_DB: ${POSTGRES_DB:-alertav}
    ports:
      - "5432:5432"
    volumes:
      - alertav_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alertav} -d ${POSTGRES_DB:-alertav}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alertav_pgdata:
