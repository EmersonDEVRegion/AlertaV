[project]
name = "alertav-backend"
version = "0.1.0"
description = "AlertaV — Fire Data Collector: recolección y correlación de señales de emergencia de la Región de Valparaíso"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "GeoAlchemy2>=0.16,<1.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.14",
]

[project.scripts]
alertav-collect = "app.collectors.runner:main"
alertav-correlate = "app.services.correlation.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # Depends() en defaults es el patrón normal de FastAPI
    "RUF001",  # caracteres unicode ambiguos en textos en español
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# `type` y `text` son nombres de columna exigidos por el contrato del esquema.
"app/models/event.py" = ["A003"]
# DDL literal, fixtures CSV reales y aserciones: partir las líneas los haría ilegibles.
"migrations/versions/*.py" = ["E501"]
"tests/*.py" = ["E501"]
"scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
ignore_missing_imports = true
