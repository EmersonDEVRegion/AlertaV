##
## tinyproxy de AlertaV en Chile: la salida del collector de Esval.
##
## Plantilla. La completa `instalar.sh` (el puerto, la clave y las IP de Render)
## y la deja en /etc/tinyproxy/tinyproxy.conf con permisos 640: trae la clave.
##
## Qué hace y qué no:
##   * Sólo túneles CONNECT al 443 de los dos hosts de Esval (ver `filter`).
##     Cualquier otro destino responde 403.
##   * Sólo clientes de las IP de salida de Render (y de la propia VM, para
##     `probar.sh`). El resto ni siquiera llega: el firewall lo descarta antes.
##   * Sólo con usuario y clave (407 sin ellos).
##   * No ve ni toca los datos: el TLS va de Render a Esval de punta a punta.
##

User tinyproxy
Group tinyproxy

Port @PUERTO@
Timeout 60
MaxClients 20

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
# Connect: una línea por conexión (quién y adónde), sin cabeceras ni cuerpos.
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"

# -- Quién puede usarlo ---------------------------------------------------------
Allow 127.0.0.1
Allow ::1
@ALLOW@

BasicAuth alertav @CLAVE@

# -- Adónde ---------------------------------------------------------------------
# Sólo CONNECT, y sólo al 443. Un GET plano a http:// también pasa por el
# filtro de dominios, y ningún dominio de la lista sirve por http.
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes

# -- Sin marcas propias -----------------------------------------------------------
# No cambian nada dentro de un túnel TLS; sólo evitan anunciar el software.
DisableViaHeader Yes
XTinyproxy No
